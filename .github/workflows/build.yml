name: build-dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld make curl jq

      - name: Fetch iPhoneOS SDK
        run: |
          SDK=$(curl -s https://api.github.com/repos/theos/sdks/contents | jq -r '.[].name' | grep -E '^iPhoneOS[0-9.]+\.sdk$' | sort -V | tail -1)
          echo "picked $SDK"
          echo "SDK=$SDK" >> $GITHUB_ENV
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git sdkrepo
          cd sdkrepo
          git sparse-checkout init --cone
          git sparse-checkout set "$SDK"
          git checkout

      - name: Compile dylib
        run: |
          SYSROOT="$PWD/sdkrepo/$SDK"
          clang --version
          clang -target arm64-apple-ios15.0 -arch arm64 -isysroot "$SYSROOT" \
            -fobjc-arc -O2 -dynamiclib -fno-modules -fuse-ld=lld \
            -framework Foundation -framework UIKit -framework AVFoundation \
            -framework CoreVideo -framework CoreImage -framework CoreGraphics \
            -framework Vision -framework CoreMotion -framework CoreMedia \
            -framework AudioToolbox -framework ImageIO -framework QuartzCore \
            Tweak/Tweak.m Tweak/IMUSynth.m -o TLCam.dylib
          file TLCam.dylib
          ls -l TLCam.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: TLCam-dylib
          path: TLCam.dylib

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" TLCam.dylib \
            -t "build ${{ github.run_number }}" -n "auto build"
