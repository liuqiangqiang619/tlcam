name: build-dylib

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld make curl jq

      - name: Fetch iPhoneOS SDK
        run: |
          SDK=$(curl -s https://api.github.com/repos/theos/sdks/contents | jq -r '.[].name' 2>/dev/null | grep -E '^iPhoneOS[0-9.]+\.sdk$' | sort -V | tail -1)
          if [ -z "$SDK" ] || [ "$SDK" = "null" ]; then SDK=iPhoneOS16.5.sdk; fi
          echo "picked $SDK"
          echo "SDK=$SDK" >> $GITHUB_ENV
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git sdkrepo
          cd sdkrepo
          git sparse-checkout init --cone
          git sparse-checkout set "$SDK"
          git checkout

      - name: Compile dylib
        run: |
          SYSROOT="$PWD/sdkrepo/$SDK"
          clang --version
          set +e
          clang -target arm64-apple-ios15.0 -arch arm64 -isysroot "$SYSROOT" \
            -fobjc-arc -O2 -dynamiclib -fno-modules -fuse-ld=lld \
            -framework Foundation -framework UIKit -framework AVFoundation \
            -framework CoreVideo -framework CoreImage -framework CoreGraphics \
            -framework Vision -framework CoreMotion -framework CoreMedia \
            -framework AudioToolbox -framework VideoToolbox -framework ImageIO -framework QuartzCore \
            Tweak/Tweak.m Tweak/IMUSynth.m -o TLCam.dylib > build.log 2>&1
          rc=$?
          cat build.log
          file TLCam.dylib 2>/dev/null
          ls -l TLCam.dylib 2>/dev/null
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: TLCam-dylib
          path: TLCam.dylib

      - name: Commit dylib to dist
        if: always()
        run: |
          if [ -f TLCam.dylib ]; then
            mkdir -p dist
            cp TLCam.dylib dist/TLCam.dylib
            cp build.log dist/build.log 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f dist/TLCam.dylib dist/build.log 2>/dev/null || git add -f dist/TLCam.dylib
            git commit -m "build: TLCam.dylib for ${{ github.sha }}" || echo "nothing to commit"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || echo "push failed"
          else
            echo "no dylib produced"
          fi

      - name: Publish release asset
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build ${{ github.run_number }}
          body: auto build from ${{ github.sha }}
          files: |
            TLCam.dylib
            build.log
          fail_on_unmatched_files: false
