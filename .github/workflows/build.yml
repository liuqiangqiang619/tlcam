name: build-dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build TLCam.dylib (arm64)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
                -miphoneos-version-min=15.0 \
                -isysroot "$SDK" \
                -fobjc-arc -O2 -dynamiclib \
                -framework Foundation -framework UIKit \
                -framework AVFoundation -framework CoreVideo \
                -framework CoreImage -framework CoreGraphics -framework Vision -framework CoreMotion \
                -framework CoreMedia -framework AudioToolbox \
                -install_name @executable_path/Frameworks/TLCam.dylib \
                Tweak/Tweak.m Tweak/IMUSynth.m -o TLCam.dylib
          ls -lh TLCam.dylib
          file TLCam.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: TLCam-dylib
          path: TLCam.dylib
